<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機台領料追蹤系統</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 10px; background: #f4f6f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .card { background: #fff; border: 2px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; }
        .card.waiting { border-color: #dc3545; background: #fff8f8; }
        .card.idle { border-color: #28a745; background: #f8fff9; }
        button { padding: 10px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; width: 100%; margin-top: 5px; }
        .btn-start { background: #28a745; }
        .btn-end { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background: #f1f1f1; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 機台領料即時控制看板</h2>

    <!-- 四台機台卡片 -->
    <div class="grid" id="cardGrid"></div>

    <!-- 匯出按鈕 -->
    <button style="background: #17a2b8; height: 45px; margin-bottom: 15px;" onclick="exportExcel()">📤 匯出 Excel 檔</button>

    <!-- 歷史表格 -->
    <table>
        <thead>
            <tr>
                <th>機台</th>
                <th>訂單號</th>
                <th>張數</th>
                <th>狀態</th>
                <th>花費時間</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- 輸入彈窗 -->
<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div style="background:white; padding:20px; border-radius:8px; width:80%; max-width:300px;">
        <h3>輸入要板資訊</h3>
        <input type="hidden" id="modalMachine">
        <p>訂單號：<input type="text" id="modalOrder" style="width:100%; padding:8px; margin-top:5px;"></p>
        <p>張數：<input type="number" id="modalQty" style="width:100%; padding:8px; margin-top:5px;" min="1"></p>
        <button class="btn-start" onclick="confirmStart()">確認開始</button>
        <button style="background:#6c757d; margin-top:5px;" onclick="closeModal()">取消</button>
    </div>
</div>

<script>
    const machines = ['Nesting 內', 'Nesting 外', '電子鋸 330', '電子鋸 長風'];
    let logs = JSON.parse(localStorage.getItem('boardLogs')) || [];

    window.onload = function() {
        render();
        setInterval(render, 1000); // 每秒更新畫面時間
    };

    function render() {
        // 1. 渲染上方卡片
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';
        machines.forEach(m => {
            const active = logs.find(l => l.machine === m && l.end === '-');
            const card = document.createElement('div');
            card.className = `card ${active ? 'waiting' : 'idle'}`;
            
            if (active) {
                const mins = ((new Date() - new Date(active.start)) / 1000 / 60).toFixed(1);
                card.innerHTML = `
                    <strong>${m}</strong><br>
                    <span style="color:#dc3545; font-size:14px;">⏳ 等待中 (${mins}分)</span>
                    <button class="btn-end" onclick="endTask(${active.id})">🏁 結束</button>
                `;
            } else {
                card.innerHTML = `
                    <strong>${m}</strong><br>
                    <span style="color:#28a745; font-size:14px;">🟢 閒置</span>
                    <button class="btn-start" onclick="openModal('${m}')">🚀 開始要板</button>
                `;
            }
            grid.appendChild(card);
        });

        // 2. 渲染下方表格
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if (logs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="color:#888;">尚無紀錄</td></tr>`;
            return;
        }
        logs.forEach(l => {
            const tr = document.createElement('tr');
            const isWait = l.end === '-';
            const mins = isWait ? ((new Date() - new Date(l.start)) / 1000 / 60).toFixed(1) : l.duration;
            tr.innerHTML = `
                <td>${l.machine}</td>
                <td>${l.order}</td>
                <td>${l.qty}</td>
                <td>${isWait ? '⏳等待' : '✅完成'}</td>
                <td>${mins}分</td>
                <td><button style="background:#dc3545; padding:4px 8px; width:auto;" onclick="del(${l.id})">刪除</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function openModal(m) {
        document.getElementById('modalMachine').value = m;
        document.getElementById('modalOrder').value = '';
        document.getElementById('modalQty').value = '';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function confirmStart() {
        const m = document.getElementById('modalMachine').value;
        const order = document.getElementById('modalOrder').value.trim();
        const qty = document.getElementById('modalQty').value.trim();
        if (!order || !qty) { alert('請填寫完整'); return; }

        logs.unshift({
            id: Date.now(),
            machine: m,
            order: order,
            qty: qty,
            start: new Date().toLocaleString(),
            end: '-',
            duration: '-'
        });
        saveAndReload();
        closeModal();
    }

    function endTask(id) {
        const l = logs.find(item => item.id === id);
        if (l) {
            l.end = new Date().toLocaleString();
            const startMs = new Date(l.start).getTime();
            const endMs = new Date(l.end).getTime();
            l.duration = ((endMs - startMs) / 1000 / 60).toFixed(1);
            saveAndReload();
        }
    }

    function del(id) {
        if (confirm('確定刪除？')) {
            logs = logs.filter(item => item.id !== id);
            saveAndReload();
        }
    }

    function saveAndReload() {
        localStorage.setItem('boardLogs', JSON.stringify(logs));
        render();
    }

    function exportExcel() {
        if (logs.length === 0) { alert('無資料'); return; }
        const ws = XLSX.utils.json_to_sheet(logs);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "紀錄");
        XLSX.writeFile(wb, "領料紀錄.xlsx");
    }
</script>

</body>
</html>
