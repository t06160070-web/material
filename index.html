<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機台三階段領料與裁板即時看板</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 8px; background-color: #f4f6f9; color: #333; font-size: 15px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 12px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { font-size: 18px; border-bottom: 3px solid #007bff; padding-bottom: 6px; margin-top: 0; margin-bottom: 12px; text-align: center; }
        
        .machine-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        @media(min-width: 768px) { .machine-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .machine-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; min-height: 130px; }
        .machine-card.idle { border-color: #28a745; background-color: #f8fff9; }
        .machine-card.waiting { border-color: #ffc107; background-color: #fffdf0; }
        .machine-card.sawing { border-color: #dc3545; background-color: #fff8f8; }
        
        .machine-header { font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 4px; }
        
        .btn-action { background-color: #28a745; color: white; border: none; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; height: 38px; margin-top: 4px; }
        
        /* 讓兩顆按鈕各佔 50% 寬度（平均大小） */
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-export { flex: 1; background-color: #17a2b8; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; height: 45px; }
        .btn-clear { flex: 1; background-color: #6c757d; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; height: 45px; }
        
        .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 750px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 6px; text-align: center; font-size: 13px; }
        th { background-color: #f8f9fa; font-weight: bold; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background-color: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; box-sizing: border-box; }
        .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .modal-field input { height: 42px; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 機台三階段領料與裁板即時看板</h2>
    <p style="font-size: 12px; color: #666; text-align: center; margin-top: -6px; margin-bottom: 12px;">
        💡 模式說明：🟢 <strong>閒置</strong> ➔ 🟡 <strong>等待 (即時碼表計時)</strong> ➔ 🔴 <strong>裁板中 (自動倒數)</strong>。
    </p>

    <!-- 四台機台固定面板 -->
    <div class="machine-grid">
        <div class="machine-card idle" id="card-Nesting 內">
            <div class="machine-header" style="color: #0d47a1;">🖥️ Nesting 內</div>
            <div id="content-Nesting 內"></div>
        </div>
        <div class="machine-card idle" id="card-Nesting 外">
            <div class="machine-header" style="color: #0d47a1;">🖥️ Nesting 外</div>
            <div id="content-Nesting 外"></div>
        </div>
        <div class="machine-card idle" id="card-電子鋸 330">
            <div class="machine-header" style="color: #1b5e20;">🪚 電子鋸 330</div>
            <div id="content-電子鋸 330"></div>
        </div>
        <div class="machine-card idle" id="card-電子鋸 長風">
            <div class="machine-header" style="color: #1b5e20;">🪚 電子鋸 長風</div>
            <div id="content-電子鋸 長風"></div>
        </div>
    </div>

    <div style="font-size: 16px; font-weight: bold; margin: 15px 0 8px 0; border-left: 4px solid #007bff; padding-left: 6px;">📊 正式歷史紀錄與數據分析</div>
    
    <!-- 兩顆平均大小的按鈕 -->
    <div class="btn-group">
        <button class="btn-export" onclick="exportToExcel()">📤 匯出 Excel 檔</button>
        <button class="btn-clear" onclick="clearAllHistory()">🗑️ 清除歷史紀錄</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>機台名稱</th>
                    <th>混搭訂單號 / 案名</th>
                    <th>張數</th>
                    <th>狀態</th>
                    <th>花費(分)</th>
                    <th>要板時間</th>
                    <th>給板結束</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 開始要板輸入彈窗 -->
<div id="startModal" class="modal">
    <div class="modal-content">
        <h3 id="startModalTitle" style="margin-top:0; text-align:center;">🚀 發起要板</h3>
        <input type="hidden" id="targetMachine">
        <div class="modal-field">
            <label style="font-weight:bold; font-size:13px;">混搭訂單號 / 案名</label>
            <input type="text" id="modalWorkOrder" placeholder="例: A01, A02">
        </div>
        <div class="modal-field">
            <label style="font-weight:bold; font-size:13px;">張數 (1張 = 10分鐘)</label>
            <input type="number" id="modalQty" placeholder="請輸入張數" min="1">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button style="flex:1; height:42px; background:#6c757d; color:white; border:none; border-radius:6px; font-weight:bold;" onclick="closeStartModal()">取消</button>
            <button style="flex:1; height:42px; background:#28a745; color:white; border:none; border-radius:6px; font-weight:bold;" onclick="confirmStartRequest()">確認要板</button>
        </div>
    </div>
</div>

<!-- 修改紀錄彈窗 -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; text-align:center;">✏️ 修正歷史紀錄</h3>
        <input type="hidden" id="editId">
        <div class="modal-field">
            <label style="font-weight:bold; font-size:13px;">混搭訂單號 / 案名</label>
            <input type="text" id="editWorkOrder">
        </div>
        <div class="modal-field">
            <label style="font-weight:bold; font-size:13px;">張數</label>
            <input type="number" id="editQty" min="1">
        </div>
        <div class="modal-field">
            <label style="font-weight:bold; font-size:13px;">要板時間 (開始)</label>
            <input type="datetime-local" id="editStartTime">
        </div>
        <div class="modal-field">
            <label style="font-weight:bold; font-size:13px;">給板結束 (完成)</label>
            <input type="datetime-local" id="editEndTime">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button style="flex:1; height:42px; background:#6c757d; color:white; border:none; border-radius:6px; font-weight:bold;" onclick="closeEditModal()">取消</button>
            <button style="flex:1; height:42px; background:#28a745; color:white; border:none; border-radius:6px; font-weight:bold;" onclick="saveModalEdit()">儲存</button>
        </div>
    </div>
</div>

<script>
    let boardLogs = JSON.parse(localStorage.getItem('boardLogs')) || [];
    let machineStates = JSON.parse(localStorage.getItem('machineStates')) || {};
    const machineNames = ['Nesting 內', 'Nesting 外', '電子鋸 330', '電子鋸 長風'];

    window.onload = function() {
        refreshView();
        setInterval(mainTick, 1000);
    };

    function mainTick() {
        const now = new Date().getTime();
        let stateChanged = false;

        machineNames.forEach(mName => {
            const m = machineStates[mName];
            if (!m) return;

            if (m.state === 'waiting') {
                const log = boardLogs.find(item => item.id === m.logId);
                if (log) {
                    const startMs = new Date(log.startTimeStr.replace(/-/g, '/')).getTime();
                    const mins = ((now - startMs) / 1000 / 60).toFixed(1);
                    const el = document.getElementById(`wait-timer-${mName}`);
                    if (el) el.innerText = `⏳ 已等待 ${mins} 分`;
                    
                    const tableEl = document.getElementById(`dur-${m.logId}`);
                    if (tableEl) tableEl.innerText = `${mins} 分`;
                }
            } else if (m.state === 'sawing') {
                const elapsedMs = now - m.sawStartTime;
                const totalAllowedMs = m.totalMinutes * 60 * 1000;

                if (elapsedMs >= totalAllowedMs) {
                    delete machineStates[mName];
                    stateChanged = true;
                } else {
                    const remainingMs = totalAllowedMs - elapsedMs;
                    const remMins = Math.ceil(remainingMs / 1000 / 60);
                    const el = document.getElementById(`saw-countdown-${mName}`);
                    if (el) el.innerText = `⏳ 剩餘約 ${remMins} 分`;
                }
            }
        });

        if (stateChanged) {
            localStorage.setItem('machineStates', JSON.stringify(machineStates));
            refreshView();
        }
    }

    function formatDateTime(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const hh = String(date.getHours()).padStart(2, '0');
        const mm = String(date.getMinutes()).padStart(2, '0');
        const ss = String(date.getSeconds()).padStart(2, '0');
        return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    }

    function openStartModal(machineName) {
        document.getElementById('targetMachine').value = machineName;
        document.getElementById('startModalTitle').innerText = `🚀 ${machineName} 發起要板`;
        document.getElementById('modalWorkOrder').value = '';
        document.getElementById('modalQty').value = '';
        document.getElementById('startModal').style.display = 'flex';
        setTimeout(() => document.getElementById('modalWorkOrder').focus(), 100);
    }

    function closeStartModal() {
        document.getElementById('startModal').style.display = 'none';
    }

    function confirmStartRequest() {
        const machineName = document.getElementById('targetMachine').value;
        const workOrder = document.getElementById('modalWorkOrder').value.trim();
        const qty = parseInt(document.getElementById('modalQty').value, 10);

        if (!workOrder || isNaN(qty) || qty <= 0) {
            alert('請完整輸入訂單號與有效張數！');
            return;
        }

        const now = new Date();
        const newLogId = Date.now();

        const newLog = {
            id: newLogId,
            date: now.toLocaleDateString(),
            machineType: machineName,
            workOrder: workOrder,
            qty: qty,
            startTimeStr: formatDateTime(now),
            endTimeStr: '-',
            duration: '-'
        };
        boardLogs.unshift(newLog);
        localStorage.setItem('boardLogs', JSON.stringify(boardLogs));

        machineStates[machineName] = {
            state: 'waiting',
            logId: newLogId,
            workOrder: workOrder,
            qty: qty,
            totalMinutes: qty * 10
        };
        localStorage.setItem('machineStates', JSON.stringify(machineStates));

        refreshView();
        closeStartModal();
    }

    function startSawing(machineName) {
        const m = machineStates[machineName];
        if (!m) return;

        const now = new Date();
        const log = boardLogs.find(item => item.id === m.logId);
        if (log) {
            log.endTimeStr = formatDateTime(now);
            const startMs = new Date(log.startTimeStr.replace(/-/g, '/')).getTime();
            log.duration = ((now.getTime() - startMs) / 1000 / 60).toFixed(1);
            localStorage.setItem('boardLogs', JSON.stringify(boardLogs));
        }

        machineStates[machineName] = {
            state: 'sawing',
            workOrder: m.workOrder,
            qty: m.qty,
            totalMinutes: m.totalMinutes,
            sawStartTime: now.getTime()
        };
        localStorage.setItem('machineStates', JSON.stringify(machineStates));

        refreshView();
    }

    function finishSawingEarly(machineName) {
        if (confirm(`確定要將【${machineName}】提前結束並恢復閒置嗎？`)) {
            delete machineStates[machineName];
            localStorage.setItem('machineStates', JSON.stringify(machineStates));
            refreshView();
        }
    }

    function clearAllHistory() {
        if (confirm('⚠️ 警告：確定要清空所有歷史紀錄與目前的機台狀態嗎？此動作無法復原！')) {
            boardLogs = [];
            machineStates = {};
            localStorage.removeItem('boardLogs');
            localStorage.removeItem('machineStates');
            refreshView();
        }
    }

    function deleteLog(id) {
        if (confirm('確定刪除此正式歷史紀錄？')) {
            boardLogs = boardLogs.filter(item => item.id !== id);
            localStorage.setItem('boardLogs', JSON.stringify(boardLogs));
            refreshView();
        }
    }

    function openEditModal(id) {
        const log = boardLogs.find(item => item.id === id);
        if (log) {
            document.getElementById('editId').value = log.id;
            document.getElementById('editWorkOrder').value = log.workOrder;
            document.getElementById('editQty').value = log.qty;
            document.getElementById('editStartTime').value = log.startTimeStr.replace(' ', 'T').substring(0, 16);
            document.getElementById('editEndTime').value = log.endTimeStr === '-' ? '' : log.endTimeStr.replace(' ', 'T').substring(0, 16);
            document.getElementById('editModal').style.display = 'flex';
        }
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function saveModalEdit() {
        const id = parseInt(document.getElementById('editId').value, 10);
        const log = boardLogs.find(item => item.id === id);
        if (log) {
            log.workOrder = document.getElementById('editWorkOrder').value.trim();
            log.qty = parseInt(document.getElementById('editQty').value, 10) || 0;
            
            const startVal = document.getElementById('editStartTime').value;
            if (startVal) {
                log.startTimeStr = startVal.replace('T', ' ') + ':00';
                log.date = new Date(startVal).toLocaleDateString();
            }

            const endVal = document.getElementById('editEndTime').value;
            log.endTimeStr = endVal ? endVal.replace('T', ' ') + ':00' : '-';

            if (log.endTimeStr !== '-') {
                const startMs = new Date(log.startTimeStr.replace(/-/g, '/')).getTime();
                const endMs = new Date(log.endTimeStr.replace(/-/g, '/')).getTime();
                log.duration = ((endMs - startMs) / 1000 / 60).toFixed(1);
            } else {
                log.duration = '-';
            }

            localStorage.setItem('boardLogs', JSON.stringify(boardLogs));
            refreshView();
            closeEditModal();
        }
    }

    function refreshView() {
        machineNames.forEach(mName => {
            const card = document.getElementById(`card-${mName}`);
            const content = document.getElementById(`content-${mName}`);
            const m = machineStates[mName];

            if (!m) {
                card.className = 'machine-card idle';
                content.innerHTML = `
                    <div style="font-size: 12px; color: #666; text-align: center; margin: 4px 0;">🟢 閒置中</div>
                    <button class="btn-action" onclick="openStartModal('${mName}')" style="background-color: #28a745;">🚀 開始要板</button>
                `;
            } else if (m.state === 'waiting') {
                card.className = 'machine-card waiting';
                const log = boardLogs.find(item => item.id === m.logId);
                const startMs = log ? new Date(log.startTimeStr.replace(/-/g, '/')).getTime() : new Date().getTime();
                const mins = ((new Date().getTime() - startMs) / 1000 / 60).toFixed(1);

                content.innerHTML = `
                    <div style="font-size: 11px; color: #555; text-align:center;">📋 ${m.workOrder} (${m.qty}張)</div>
                    <div id="wait-timer-${mName}" style="color: #b78103; font-weight: bold; font-size: 14px; margin: 2px 0; text-align:center;">⏳ 已等待 ${mins} 分</div>
                    <button class="btn-action" onclick="startSawing('${mName}')" style="background-color: #ffc107; color: #212529;">▶️ 開始裁板</button>
                `;
            } else if (m.state === 'sawing') {
                card.className = 'machine-card sawing';
                const elapsedMs = new Date().getTime() - m.sawStartTime;
                const totalAllowedMs = m.totalMinutes * 60 * 1000;
                const remainingMs = Math.max(0, totalAllowedMs - elapsedMs);
                const remMins = Math.ceil(remainingMs / 1000 / 60);

                content.innerHTML = `
                    <div style="font-size: 11px; color: #555; text-align:center;">📋 ${m.workOrder} (${m.qty}張)</div>
                    <div id="saw-countdown-${mName}" style="color: #d9534f; font-weight: bold; font-size: 14px; margin: 2px 0; text-align:center;">⏳ 剩餘約 ${remMins} 分</div>
                    <button class="btn-action" onclick="finishSawingEarly('${mName}')" style="background-color: #dc3545; height: 32px; font-size: 12px; margin-top: 2px;">🏁 提前結束</button>
                `;
            }
        });

        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';
        if (boardLogs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" style="color: #888; padding: 15px;">目前尚無歷史紀錄</td></tr>`;
            return;
        }

        boardLogs.forEach(log => {
            const tr = document.createElement('tr');
            const isWaiting = log.endTimeStr === '-';
            let mins = log.duration;
            if (isWaiting) {
                const startMs = new Date(log.startTimeStr.replace(/-/g, '/')).getTime();
                mins = ((new Date().getTime() - startMs) / 1000 / 60).toFixed(1);
            }

            tr.innerHTML = `
                <td>${log.date}</td>
                <td><strong>${log.machineType}</strong></td>
                <td>${log.workOrder}</td>
                <td>${log.qty} 張</td>
                <td>${isWaiting ? '<span style="background:#fff3cd; color:#856404; padding:2px 6px; border-radius:4px;">🟡等待中</span>' : '<span style="background:#d4edda; color:#155724; padding:2px 6px; border-radius:4px;">✅已完成</span>'}</td>
                <td><strong style="color: ${isWaiting ? '#d9534f' : '#333'};" ${isWaiting ? `id="dur-${log.id}"` : ''}>${mins} 分</strong></td>
                <td>${log.startTimeStr}</td>
                <td>${log.endTimeStr}</td>
                <td>
                    <button style="background:#ffc107; color:#212529; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="openEditModal(${log.id})">✏️</button>
                    <button style="background:#dc3545; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="deleteLog(${log.id})">❌</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function exportToExcel() {
        if (boardLogs.length === 0) { alert('沒有歷史紀錄可匯出！'); return; }
        
        const excelData = boardLogs.map(log => {
            const isWaiting = log.endTimeStr === "-";
            let durationVal = log.duration;
            if (isWaiting) {
                const startMs = new Date(log.startTimeStr.replace(/-/g, '/')).getTime();
                durationVal = ((new Date().getTime() - startMs) / 1000 / 60).toFixed(1);
            }
            return {
                "日期": log.date,
                "機台名稱": log.machineType,
                "混搭訂單號 / 案名": log.workOrder,
                "張數": log.qty,
                "狀態": isWaiting ? "等待中" : "已完成",
                "花費時間(分鐘)": durationVal,
                "要板時間(開始)": log.startTimeStr,
                "給板結束(完成)": log.endTimeStr
            };
        });

        const ws = XLSX.utils.json_to_sheet(excelData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "生產與領料紀錄");
        XLSX.writeFile(wb, `機台領料紀錄_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }
</script>

</body>
</html>
